name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: [self-hosted, android]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Lint
        run: ./gradlew lintDebug

      - name: Test
        run: ./gradlew testDebugUnitTest --continue || true

      - name: Assemble Debug
        run: ./gradlew assembleDebug

      - name: Build Release APK (16KB gate artifact)
        run: |
          # Self-hosted runner persists /tmp across runs — stale keystore
          # would fail genkeypair with "alias <ci> already exists".
          rm -f /tmp/ci-release.jks
          keytool -genkeypair -keystore /tmp/ci-release.jks -alias ci -keyalg RSA -keysize 2048 -validity 30 -storepass ci-release-pass -keypass ci-release-pass -dname "CN=CI, OU=CI, O=CI, C=US"
          echo "RELEASE_STORE_FILE=/tmp/ci-release.jks" >> local.properties
          echo "RELEASE_STORE_PASSWORD=ci-release-pass" >> local.properties
          echo "RELEASE_KEY_ALIAS=ci" >> local.properties
          echo "RELEASE_KEY_PASSWORD=ci-release-pass" >> local.properties
          ./gradlew assembleRelease

      - name: Verify 16KB native alignment
        run: ./scripts/check_elf_alignment.sh app/build/outputs/apk/release/app-release.apk
