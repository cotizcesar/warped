name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

jobs:
  build:
    runs-on: [self-hosted, android]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-35 platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Lint
        run: ./gradlew lintDebug

      - name: Test
        # No `|| true`: test failures must fail the gate (branch
        # protection requires this job green before merge).
        run: ./gradlew testDebugUnitTest --continue

      - name: Assemble Debug
        run: ./gradlew assembleDebug

      - name: Build Release APK (16KB gate artifact)
        run: |
          # Self-hosted runner persists /tmp across runs — stale keystore
          # would fail genkeypair with "alias <ci> already exists".
          rm -f /tmp/ci-release.jks
          keytool -genkeypair -keystore /tmp/ci-release.jks -alias ci -keyalg RSA -keysize 2048 -validity 30 -storepass ci-release-pass -keypass ci-release-pass -dname "CN=CI, OU=CI, O=CI, C=US"
          echo "RELEASE_STORE_FILE=/tmp/ci-release.jks" >> local.properties
          echo "RELEASE_STORE_PASSWORD=ci-release-pass" >> local.properties
          echo "RELEASE_KEY_ALIAS=ci" >> local.properties
          echo "RELEASE_KEY_PASSWORD=ci-release-pass" >> local.properties
          ./gradlew assembleRelease

      - name: Verify 16KB native alignment
        run: ./scripts/check_elf_alignment.sh app/build/outputs/apk/release/app-release.apk

  security:
    runs-on: [self-hosted, android]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-35 platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Fail-closed dependency gate: banned deps (kapt, Firebase,
      # Moshi/Gson, Ktor, TFLite, ML Kit, AppAuth, cameraX,
      # datastore-proto) fail the build. Required status check.
      - name: Dependency audit
        run: ./gradlew auditDependencies
