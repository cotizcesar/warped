name: Release

# Gated releases: runs ONLY after the CI workflow completes GREEN on
# beta/main (never on raw push). The AAB is built from the exact commit
# CI validated (head_sha pinning below) — a red gate can never ship.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [beta, main]
    types: [completed]

# Serialize Play uploads per branch (concurrent edits/reviews on the
# same track corrupt the release — Oct 2026 lesson). No cancel.
concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the exact commit CI validated — never default-branch HEAD.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-35 platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Prepare keystore
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/keystore/warped-release.jks

      - name: Write signing config
        run: |
          echo "RELEASE_STORE_FILE=keystore/warped-release.jks" >> local.properties
          echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> local.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> local.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> local.properties

      - name: Build Release Bundle
        run: ./gradlew bundleRelease

      - name: Verify 16KB native alignment
        run: ./scripts/check_elf_alignment.sh app/build/outputs/bundle/release/app-release.aab

      - name: Determine Play Store track
        id: track
        run: |
          # Branch → track: beta ships to Open Testing, main ships to
          # Production (main only moves via promotion PR from beta after
          # validation). NOTE: under workflow_run, github.ref_name is the
          # default branch — read the triggering branch explicitly.
          if [ "${{ github.event.workflow_run.head_branch }}" = "beta" ]; then
            echo "track=beta" >> "$GITHUB_OUTPUT"
          else
            echo "track=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Google Play Store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          packageName: com.warped.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ steps.track.outputs.track }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-aab-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.head_sha }}
          path: app/build/outputs/bundle/release/app-release.aab
