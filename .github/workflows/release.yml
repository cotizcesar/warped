name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: [self-hosted, android]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-35 platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Prepare keystore
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/keystore/warped-release.jks

      - name: Write signing config
        run: |
          echo "RELEASE_STORE_FILE=keystore/warped-release.jks" >> local.properties
          echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> local.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> local.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> local.properties

      - name: Build Release Bundle
        run: ./gradlew bundleRelease

      - name: Verify 16KB native alignment
        run: ./scripts/check_elf_alignment.sh app/build/outputs/bundle/release/app-release.aab

      - name: Determine Play Store track
        id: track
        run: |
          # Single-branch flow: main always ships to the Beta track (where
          # beta deployed before the restructure). Promotion to Production
          # is manual in Play Console (promote the beta release).
          echo "track=beta" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play Store
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          packageName: com.warped.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ steps.track.outputs.track }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-aab-${{ github.ref_name }}
          path: app/build/outputs/bundle/release/app-release.aab
