[versions]
kotlin = "2.3.20"
agp = "9.3.0"
litertlm = "0.17.1"  # 45-02 LRT-07: 0.13.1 -> 0.17.1 pinned stable (2026-09-16, latest on Google Maven; verified vs maven-metadata.xml)
compose-bom = "2026.06.01"  # newest BOM on compileSdk<=36 line (2026.08.00+ needs android-37 platform, not yet released)
hilt = "2.60.1"
hilt-navigation-compose = "1.3.0"  # HOLD: 1.4.0 needs compileSdk 37 (no stable android-37 platform in SDK repo)
hilt-work = "1.4.0"
room = "2.8.5"
lifecycle = "2.10.0"  # HOLD: 2.11.0 needs compileSdk 37 (no stable android-37 platform in SDK repo)
navigation = "2.9.8"  # newest line compiling against installed SDK (2.10.x needs compileSdk 37, unavailable stable)
okhttp = "4.12.0"
retrofit = "3.0.0"
kotlinx-serialization = "1.11.0"
kotlinx-serialization-converter = "3.0.0"  # match retrofit 3.x (Gradle already resolved 1.0.0 -> 3.0.0 via conflict)
coroutines = "1.11.0"
jsoup = "1.23.2"
coil3 = "3.4.0"  # Phase 58 (OG-02): Coil image loader for OG thumbnails (Maven Central verified in RESEARCH.md)
  # CEILING: 3.4.0 is the newest line compiling against compileSdk 35 —
  # 3.5.0 raised compile SDK to 36, 3.6.x to 37 (changelog-confirmed 2026-09-29);
  # repo holds compileSdk 35 (android-37 platform unavailable stable).
datastore = "1.2.1"
# Play In-App Review (Phase 66, RATE-01/RATE-02): ambient review prompt +
# Settings Store entry. First-party Google (com.google.android.play);
# verified latest stable 2.0.2 via Google Maven metadata 2026-10-02.
play-review = "2.0.2"
workmanager = "2.12.0"
security-crypto = "1.1.0"  # latest stable
profileinstaller = "1.4.1"  # PERF-16: Maven-confirmed latest stable 2026-09-28 (androidx.profileinstaller)
baselineprofile = "1.5.0"  # PERF-16: tracks benchmark 1.5.0 (androidx.benchmark:benchmark-baseline-profile-gradle-plugin; Maven-confirmed latest stable 2026-09-28; 1.3.3 plugin cannot apply under AGP 9 — legacy AppExtension API removed)
kotlinx-collections-immutable = "0.5.2"
sqlcipher = "4.19.1"  # Phase 59 (16KB): migrated android-database-sqlcipher 4.5.4 -> sqlcipher-android 4.19.1.
  # The legacy android-database-sqlcipher Community Edition is EOL (2023) and its
  # libsqlcipher.so is built with 4KB (0x1000) LOAD alignment — no newer release
  # exists (4.5.4 is latest on Maven Central). sqlcipher-android is Zetetic's
  # official successor (same engine + DB format, new net.zetetic.database.*
  # API); 16KB-aligned (0x4000) on all ABIs since 4.6.1 per Zetetic 2026-06-26.
timber = "5.0.1"
highlights = "1.1.0"
# Quick-task langdetect-library (Task 0 verdict CLEAN 2026-09-30): Optimaize
# language-detector, latest stable on Maven Central (0.6, released 2016-10-07;
# no newer stable exists). Empirical releaseRuntimeClasspath diff adds ONLY:
# language-detector itself + net.arnx:jsonic:1.2.11 + com.intellij:annotations:12.0
# + com.google.guava:guava:18.0 + org.slf4j:slf4j-api:1.7.6 — zero banned
# transitives, zero pre-release (all four POMs declare no dependencies).
langdetect = "0.6"
ksp = "2.3.12"  # VERIFIED 2026-09-27 via Maven Central plugin-marker metadata
  # (com.google.devtools.ksp.gradle.plugin): KSP uses unified bare 2.3.x versioning
  # since 2.3.0 (no <kotlin>-<ksp> suffix); 2.3.12 is the latest release in the
  # 2.3.x line and targets the Kotlin 2.3.x compiler family (incl. 2.3.20).
# Testing
junit5 = "5.14.4"  # latest 5.x line (JUnit 6 major held: Gradle/MockK compat risk)
junit-platform = "1.14.4"  # lockstep with junit5 5.14.4 (platform 1.x <-> jupiter 5.x)
mockk = "1.14.11"
turbine = "1.2.1"
truth = "1.4.5"
coroutines-test = "1.11.0"
uiautomator = "2.3.0"  # held: 2.4.0 needs compileSdk 37 (no stable android-37 platform in SDK repo)
errorprone = "2.50.0"
# LeakCanary (Phase 61, LEAK-01): debug-only heap analysis; auto-installs via ContentProvider
leakcanary = "2.14"

[libraries]
# Kotlin BOM (governs kotlin-stdlib alignment with the compiler)
kotlin-bom = { group = "org.jetbrains.kotlin", name = "kotlin-bom", version.ref = "kotlin" }
# Compose BOM (governs all Compose versions)
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
# Compose
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-ui-test = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# Lifecycle + ViewModel
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }

# Navigation
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-androidx-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hilt-work" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hilt-work" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Networking
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }

# Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Coroutines
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# HTML parsing (parse-only; never Jsoup.connect())
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }

# Coil 3 image loader (OG thumbnails; own OkHttp instance via coil-network-okhttp)
coil3-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil3" }
coil3-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil3" }
coil3-test = { group = "io.coil-kt.coil3", name = "coil-test", version.ref = "coil3" }

# WorkManager
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }

# Baseline Profiles (PERF-16): installs the checked-in baseline-prof.txt on Android 7+ without Play
profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }

# Benchmark (PERF-16): pinned to version.ref baselineprofile — bump in one place
benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "baselineprofile" }
benchmark-junit4 = { group = "androidx.benchmark", name = "benchmark-junit4", version.ref = "baselineprofile" }

# Collections
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "kotlinx-collections-immutable" }

# DataStore
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Play In-App Review (Phase 66): review-ktx only, no other new dependencies
play-review-ktx = { group = "com.google.android.play", name = "review-ktx", version.ref = "play-review" }

# Security
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security-crypto" }
sqlcipher = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }

# Logging
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

# LeakCanary (Phase 61, LEAK-01): debugImplementation ONLY — never release
leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

# LiteRT-LM
litertlm = { group = "com.google.ai.edge.litertlm", name = "litertlm-android", version.ref = "litertlm" }

# Highlights — syntax tokenization engine
highlights = { group = "dev.snipme", name = "highlights", version.ref = "highlights" }

# Language detection (Optimaize, offline JVM, es+en short-text profiles only).
# Transitive JSON parser (jsonic) stays transitive — fewer direct declarations.
langdetect-detector = { group = "com.optimaize.languagedetector", name = "language-detector", version.ref = "langdetect" }

# Testing
junit5 = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit5" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit-platform" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines-test" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
errorprone-annotations = { group = "com.google.errorprone", name = "error_prone_annotations", version.ref = "errorprone" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }  # PERF-16: generates/embeds baseline-prof.txt
